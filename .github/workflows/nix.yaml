name: Nix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Fast gates: formatting, lints, tier-1 unit tests.
  check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Check formatting (rustfmt)
        run: nix-build -A rust-fmt

      - name: Check lints (clippy)
        run: nix-build -A rust-clippy

      - name: Run unit tests (tier-1)
        run: nix-build -A rust-tests

      - name: Check that invariants name existing tests
        run: nix-build -A invariants-check

  # Build the release binary.
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-15
    runs-on: ${{ matrix.os }}
    needs: check
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Build yb with the staged nixpkgs recipe
        run: nix-build -A yb

  # Intel macOS, without Nix: nixpkgs dropped x86_64-darwin in 26.11, but
  # `cargo install yb` from crates.io still works there.  Plain cargo with a
  # stable toolchain; PC/SC comes from macOS.  GitHub retires this runner in
  # August 2027.
  intel-macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests (tier-1)
        run: cargo test --locked --manifest-path rust/Cargo.toml -p yb-core -p yb --features yb/self-test

  # libyubiblob, the C API (spec 0039), on Windows: plain cargo, against
  # the simulated YubiKey; PC/SC comes from Windows (WinSCard).  Keeps the
  # interface and the code free of Unix-only assumptions (yb itself is not
  # shipped for Windows).
  windows-libyubiblob:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test libyubiblob
        run: cargo test --locked --manifest-path rust/Cargo.toml -p yubiblob

      - name: Build the C library (cargo-c)
        run: |
          cargo install cargo-c --locked
          cargo cbuild --manifest-path rust/Cargo.toml -p yubiblob --release

  # Release artifacts: the crates.io packages (built and tested from the
  # .crate files alone) and the staged nixpkgs files (nixfmt, version).
  packaging:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Check the staged nixpkgs files
        run: nix-build -A nixpkgs-staging-check

      # libyubiblob from C: installed with cargo-c, compiled through its
      # pkg-config file, run on a simulated YubiKey (spec 0039).
      - name: Check libyubiblob from C
        run: nix-shell default.nix -A dev-shell --run scripts/check-libyubiblob

      # Outside the Nix sandbox: cargo needs the network to package crates
      # that depend on each other (spec 0029 §9).
      - name: Package and test the crates.io crates
        run: nix-shell default.nix -A release-shell --run scripts/check-crates

  # Integration tests: NixOS VM with pcscd + vsmartcard + piv-authenticator,
  # the staged nixpkgs VM test against the locally built yb.
  # Linux only: requires KVM.
  integration:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            system-features = nixos-test kvm

      - name: Run integration tests (tier-1 + tier-2, NixOS VM)
        run: nix-build -A integration-tests
