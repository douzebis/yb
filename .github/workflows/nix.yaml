name: Nix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Fast gates: formatting, lints, tier-1 unit tests.
  check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Check formatting (rustfmt)
        run: nix-build -A rust-fmt

      - name: Check formatting (nixfmt)
        run: nix-build -A nix-fmt

      - name: Check lints (clippy)
        run: nix-build -A rust-clippy

      - name: Run unit tests (tier-1)
        run: nix-build -A rust-tests

      - name: Check that invariants name existing tests
        run: nix-build -A invariants-check

  # Build the release binary.
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-15
    runs-on: ${{ matrix.os }}
    needs: check
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Build yb with the staged nixpkgs recipe
        run: nix-build -A yb

  # Intel macOS, without Nix: nixpkgs dropped x86_64-darwin in 26.11, but
  # `cargo install yb` from crates.io still works there.  Plain cargo with a
  # stable toolchain; PC/SC comes from macOS, libfido2 from Homebrew.  GitHub retires this runner in
  # August 2027.
  intel-macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # libfido2, for post-quantum stores (spec 0028).
      - name: Install libfido2
        run: brew install libfido2 pkg-config

      - name: Run unit tests (tier-1)
        run: cargo test --locked --manifest-path rust/Cargo.toml -p yb-core -p yb --features yb/self-test

  # The oldest Rust the published crates declare (rust-version = "1.86"):
  # checked, not assumed.  Plain cargo; PC/SC from Ubuntu.
  msrv:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@1.86

      - name: Install PC/SC and libfido2
        run: sudo apt-get install -y libpcsclite-dev libfido2-dev

      - name: Test the published crates
        run: >-
          cargo test --locked --manifest-path rust/Cargo.toml
          -p yb-core -p yb -p yubiblob -p clap-complete-rawline

  # yb and libyubiblob on Windows (spec 0043): plain cargo, against the
  # simulated YubiKey; PC/SC comes from Windows (WinSCard).  Without FIDO2
  # (no libfido2): legacy stores only (spec 0028 D9).  The static C runtime
  # and the toolchain are those of the release build (publish.yaml), so
  # the tests run on what is shipped.
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98.1" # the Nix build's; bumped with it (spec 0043 S5)

      - name: Test the published crates
        run: >-
          cargo test --locked --manifest-path rust/Cargo.toml
          -p yb-core -p yb -p yubiblob -p clap-complete-rawline

      - name: Build yb
        run: cargo build --locked --release --manifest-path rust/Cargo.toml -p yb

      - name: Build the C library (cargo-c)
        run: |
          cargo install cargo-c --locked --version 0.10.22
          cargo cbuild --locked --release --manifest-path rust/Cargo.toml -p yubiblob

  # Release artifacts: the crates.io packages (built and tested from the
  # .crate files alone) and the staged nixpkgs files (nixfmt, version).
  packaging:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Check the staged nixpkgs files
        run: nix-build -A nixpkgs-staging-check

      # libyubiblob from C: installed with cargo-c, compiled through its
      # pkg-config file, run on a simulated YubiKey (spec 0039).
      - name: Check libyubiblob from C
        run: nix-shell default.nix -A dev-shell --run scripts/check-libyubiblob

      # Outside the Nix sandbox: cargo needs the network to package crates
      # that depend on each other (spec 0029 §9).
      - name: Package and test the crates.io crates
        run: nix-shell default.nix -A release-shell --run scripts/check-crates

  # Integration tests: NixOS VM with pcscd + vsmartcard + piv-authenticator,
  # the staged nixpkgs VM test against the locally built yb.
  # Linux only: requires KVM.
  integration:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            system-features = nixos-test kvm

      - name: Run integration tests (tier-1 + tier-2, NixOS VM)
        run: nix-build -A integration-tests
