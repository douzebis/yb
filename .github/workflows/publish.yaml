# Publish yb-core and yb to crates.io (spec 0029 §9).
#
# A pushed tag v* starts it.  `verify` checks the tag and builds and tests
# the .crate files (artifact `crates`, to inspect before approving).
# `publish` runs in the `crates-io` environment, which requires the
# maintainer's approval and only accepts v* tags (repository settings), and
# authenticates with crates.io trusted publishing: no stored secret.
#
# Run by hand (workflow_dispatch) on a tag, it does a dry run unless told
# otherwise.

name: Publish to crates.io

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run `cargo publish --dry-run` (upload nothing)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Check the tag against the Cargo version
        run: |
          version=$(nix-instantiate --eval --raw -E \
            '(builtins.fromTOML (builtins.readFile ./rust/Cargo.toml)).workspace.package.version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::ref $GITHUB_REF_NAME does not match version $version (rust/Cargo.toml)"
            exit 1
          fi

      - name: Package and test the crates
        run: nix-shell default.nix -A release-shell --run scripts/check-crates

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crates
          path: rust/target/package/*.crate

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Authenticate to crates.io
        if: ${{ !inputs.dry-run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # `verify` already built and tested the packages from the same tagged
      # source and lock file, so the upload does not build them again.
      - name: Publish yb-core, then yb
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: |
          nix-shell default.nix -A release-shell --run \
            "cargo publish --manifest-path rust/Cargo.toml --workspace \
               --exclude yb-piv-harness --locked --no-verify $DRY_RUN"
