version = 1
SPDX-PackageName = "yb"
SPDX-PackageSupplier = "Frederic Ruget <fred@atlant.is>"
SPDX-PackageDownloadLocation = "https://github.com/douzebis/yb"

[[annotations]]
path = ["rust/Cargo.lock", "Cargo.lock", "rust/yb-core/tests/fixtures/**.yaml", ".gitignore", ".gitmodules", "LICENSE", "instructions.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)"
SPDX-License-Identifier = "MIT"

# Files staged for nixpkgs: copied there verbatim, so they carry no header
# (spec 0029 §1).
[[annotations]]
path = "nixpkgs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "mirror/vpicc-rs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 Nitrokey GmbH"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "mirror/piv-authenticator/**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["Nicolas Stalder <n@stalder.io>", "Nitrokey GmbH"]
SPDX-License-Identifier = "Apache-2.0 OR MIT"
