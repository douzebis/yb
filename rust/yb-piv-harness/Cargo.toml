[package]
name    = "yb-piv-harness"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "yb_piv_harness"
path = "src/lib.rs"

[features]
default           = []
integration-tests = [
    "dep:piv-authenticator",
    "dep:vpicc",
    "dep:stoppable_thread",
    "dep:libtest-mimic",
    "dep:yb-core",
    "dep:p256",
    "dep:rand",
    "dep:tempfile",
    "dep:trussed",
]

[dependencies]
pcsc             = "2"
vpicc            = { version = "0.1.0", optional = true }
stoppable_thread = { version = "0.2", optional = true }
# Used by the test binaries (src/bin), hence regular optional dependencies.
libtest-mimic    = { version = "0.8", optional = true }
yb-core          = { path = "../yb-core", features = ["virtual-piv"], optional = true }
p256             = { version = "0.13", features = ["ecdh"], optional = true }
rand             = { version = "0.8", optional = true }
tempfile         = { version = "3", optional = true }
# piv-authenticator uses trussed without default features, hence without any
# `clients-N` feature: trussed then has room for 0 clients, and the emulated
# card panics on start-up.  `clients-1` gives its one client a channel (the
# workspace patches trussed to the revision piv-authenticator expects).
trussed          = { version = "0.1", default-features = false, features = ["clients-1"], optional = true }

[dependencies.piv-authenticator]
git      = "https://github.com/trussed-dev/piv-authenticator"
rev      = "a4a4204e7089a6a5a99907877576cc40c75825ab"
features = ["vpicc"]
optional = true

# The tier-2 tests are binaries (libtest-mimic), not `cargo test` targets:
# they need pcscd with a virtual smart card, and are run by the NixOS VM
# test (spec 0029 §4).  Locally:
#   cargo run -p yb-piv-harness --features integration-tests --bin hardware_piv_tests
[[bin]]
name              = "hardware_piv_tests"
required-features = ["integration-tests"]
test              = false

[[bin]]
name              = "yb_cli_tests"
required-features = ["integration-tests"]
test              = false
