[package]
name        = "yb-fido2-emulator"
version     = "0.1.0"
edition     = "2021"
license     = "MIT"
publish     = false
description = "A FIDO2 authenticator in memory (Google's OpenSK) behind libfido2's custom I/O functions, for yb's tests (spec 0028)"

[dependencies]
# Not on crates.io: pinned to a commit (spec 0028, "Tests").
# Google's OpenSK at 636d85b, from a fork whose one extra commit drops the
# wasefire submodule: Cargo checks out a git dependency's submodules, and
# this one brings about 750 MB that libraries/opensk does not use.
opensk = { git = "https://github.com/douzebis/OpenSK", rev = "059cdbe2268d9ea2aae476a3d495c0c0660d1a9b", features = ["std"] }

# The tests exercise yb-core's FIDO2 module through this emulator: they live
# here, so that yb-core (published) does not depend on this crate.
[dev-dependencies]
yb-core  = { path = "../yb-core", features = ["test-utils", "test-fixture"] }
yubiblob = { path = "../yubiblob", features = ["test-fixture"] }
anyhow   = "1"
rand     = "0.8"
tempfile = "3"
