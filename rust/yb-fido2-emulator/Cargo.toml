[package]
name        = "yb-fido2-emulator"
version     = "0.1.0"
edition     = "2021"
license     = "MIT"
publish     = false
description = "A FIDO2 authenticator in memory (Google's OpenSK) behind libfido2's custom I/O functions, for yb's tests (spec 0028)"

[dependencies]
# Google's OpenSK, as a library (spec 0028, "Tests").
opensk = { version = "0.1", features = ["std"] }

# The tests exercise yb-core's FIDO2 module through this emulator: they live
# here, so that yb-core (published) does not depend on this crate.
[dev-dependencies]
yb-core  = { path = "../yb-core", features = ["test-utils", "test-fixture"] }
yubiblob = { path = "../yubiblob", features = ["test-fixture"] }
anyhow   = "1"
rand     = "0.8"
tempfile = "3"
