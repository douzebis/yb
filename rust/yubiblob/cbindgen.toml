# The C header, yubiblob.h (spec 0039), generated by cargo-c.
language = "C"
include_guard = "YUBIBLOB_H"
autogen_warning = "/* Generated from rust/yubiblob by cbindgen: do not edit. */"
header = "/* SPDX-FileCopyrightText: Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)\n * SPDX-License-Identifier: MIT */"
cpp_compat = true
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true

[export.rename]
"Status" = "yubiblob_status_t"
"SignatureVerdict" = "yubiblob_signature_t"
"Device" = "yubiblob_device_t"
"BlobInfo" = "yubiblob_blob_info_t"
"StoreInfo" = "yubiblob_store_info_t"
"Session" = "yubiblob_session_t"
"TouchCallback" = "yubiblob_touch_callback_t"
